<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nimbus Developers{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">&#9729; Nimbus <span>Developers</span></a>
    <input id="search" type="search" placeholder="Search docs" autocomplete="off">
    <nav>
      <a href="{{ url_for('doc', slug='getting-started') }}">Docs</a>
      <a href="{{ url_for('doc', slug='changelog') }}">Changelog</a>
      {% if user %}
        <a href="{{ url_for('account') }}">{{ user.name }}</a>
        <a href="{{ url_for('auth_logout') }}">Sign out</a>
      {% else %}
        <a class="btn" href="{{ url_for('auth_login', next=request.path) }}">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <ul id="search-results" hidden></ul>
  <main>{% block content %}{% endblock %}</main>
  <footer>Nimbus Developers is a fictional site built for a security training lab.</footer>
  <script src="{{ url_for('static', filename='js/search.js') }}"></script>
</body>
</html>
